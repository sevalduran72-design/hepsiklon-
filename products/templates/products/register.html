<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Hepsiburada Kopyası</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hb-color { color: #ff6000; }
        .hb-bg { background-color: #ff6000; color: white; border: none; }
        .hb-bg:hover { background-color: #e55600; color: white; }
        /* Django'nun otomatik oluşturduğu form alanlarını güzelleştirmek için ufak bir dokunuş */
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 5px; }
        ul.errorlist { color: red; list-style-type: none; padding: 0; }
        .helptext { font-size: 12px; color: gray; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white shadow-sm mb-5 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 hb-color" href="{% url 'home' %}">hepsiburada</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="text-center fw-bold mb-4">Yeni Hesap Oluştur</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <button type="submit" class="btn hb-bg w-100 fw-bold py-2 mt-3">Kayıt Ol</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="text-decoration-none text-muted">Zaten hesabın var mı? <span class="hb-color fw-bold">Giriş Yap</span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
